# taplo wants to reorder commands in alphabetical order, but order is important here
# config/, e2e/config/, and vendor/ arrived with the Go implementation
# import and keep their original formatting.
exclude = ["Cross.toml", "config/*.toml", "e2e/config/*.toml", "vendor/**"]

[[rule]]

[rule.formatting]
indent_string = "    "
reorder_arrays = true
reorder_keys = true

[workspace]
members = ["crates/bpfman-kernel-aya", "crates/bpfman-store", "crates/bpfman-store-json", "crates/bpfman-kernel", "crates/bpfman-model", "crates/bpfman-core", "crates/bpfman-lock", "crates/bpfman-fs", "crates/bpfman-store-sqlite", "crates/bpfman-runtime", "crates/bpfman"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/bpfman/bpfman"
publish = false

[workspace.dependencies]
bpfman-kernel-aya = { path = "crates/bpfman-kernel-aya" }
bpfman-store = { path = "crates/bpfman-store" }
bpfman-kernel = { path = "crates/bpfman-kernel" }
bpfman-model = { path = "crates/bpfman-model" }
bpfman-core = { path = "crates/bpfman-core" }
bpfman-lock = { path = "crates/bpfman-lock" }
bpfman-fs = { path = "crates/bpfman-fs" }
bpfman-store-sqlite = { path = "crates/bpfman-store-sqlite" }
bpfman-store-json = { path = "crates/bpfman-store-json" }
bpfman-runtime = { path = "crates/bpfman-runtime" }
aya = { version = "0.14", default-features = false }
aya-obj = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "mount", "net"] }
libc = "0.2"
humantime = "2"
signal-hook = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.3", default-features = false }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-chrome = "0.7"
# Error derives work with core::error::Error; pure crates must not enable std.
thiserror = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

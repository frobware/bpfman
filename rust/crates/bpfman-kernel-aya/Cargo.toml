[package]
name = "bpfman-kernel-aya"
description = "Linux kernel observation implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo cannot override an inherited forbid for one module. Mirror the workspace
# gates, using deny only here so the private read-only syscall module can opt in.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
[lints.clippy]
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[dependencies]
bpfman-kernel.workspace = true
bpfman-fs.workspace = true
bpfman-model.workspace = true
aya-obj.workspace = true
libc.workspace = true
chrono.workspace = true
thiserror.workspace = true

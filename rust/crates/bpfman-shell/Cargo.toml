[package]
name = "bpfman-shell"
description = "Rust bpfman-shell driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bpfman-kernel-aya = { path = "../bpfman-kernel-aya" }
bpfman-shell-check = { path = "../bpfman-shell-check" }
bpfman-shell-ir = { path = "../bpfman-shell-ir" }
bpfman-shell-lower = { path = "../bpfman-shell-lower" }
bpfman-shell-runtime = { path = "../bpfman-shell-runtime" }
bpfman-shell-semantics = { path = "../bpfman-shell-semantics" }
bpfman-shell-syntax = { path = "../bpfman-shell-syntax" }
clap.workspace = true
jaq-core = "=3.1.2"
jaq-json = "=2.0.3"
jaq-std = "=3.0.4"
jiff = { version = "0.2", default-features = false, features = ["tz-system", "tzdb-zoneinfo"] }
object.workspace = true
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
signal-hook.workspace = true
tempfile.workspace = true

# The fixture's two fixed ELF symbol names use export attributes.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[package]
name = "bpfman-shell"
description = "Rust bpfman-shell driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bpfman-shell-check = { path = "../bpfman-shell-check" }
bpfman-shell-ir = { path = "../bpfman-shell-ir" }
bpfman-shell-lower = { path = "../bpfman-shell-lower" }
bpfman-shell-runtime = { path = "../bpfman-shell-runtime" }
bpfman-shell-syntax = { path = "../bpfman-shell-syntax" }
clap.workspace = true
jaq-core = "=3.1.2"
jaq-json = "=2.0.3"
jaq-std = "=3.0.4"
rustix = { version = "1", default-features = false, features = ["process", "std"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
signal-hook.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "bpfman"
description = "BPF program manager: programs, links and bytecode images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the private exec descriptor module permits unsafe operations.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
[lints.clippy]
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[dependencies]
bpfman-kernel.workspace = true
bpfman-image-oci.workspace = true
bpfman-lock.workspace = true
rustix = { workspace = true, features = ["thread"] }
libc.workspace = true
bpfman-kernel-aya.workspace = true
bpfman-store-sqlite.workspace = true
bpfman-store.workspace = true
serde_json.workspace = true
serde.workspace = true
toml = { workspace = true, features = ["parse", "serde", "std"] }
anyhow.workspace = true
base64.workspace = true
bpfman-fs.workspace = true
bpfman-model.workspace = true
bpfman-core.workspace = true
bpfman-runtime.workspace = true
clap.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-chrome.workspace = true

[dev-dependencies]
sha2.workspace = true
aya.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

name: arm64 runner KVM probe

# Throwaway diagnostic: establish whether the hosted arm64 runners
# expose /dev/kvm and permit the unprivileged user namespaces
# virtiofsd needs, before building an arm64 leg of the lsm e2e
# matrix on top. Dispatch-only; delete once the facts are known.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Host facts
        run: |
          uname -m
          nproc
          grep -m1 'model name\|^CPU part' /proc/cpuinfo || true
          ls -la /dev/kvm 2>&1 || echo "NO /dev/kvm"
          lsmod | grep -i kvm || true

      - name: KVM device permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm 2>&1 || echo "NO /dev/kvm after udev"

      - name: Unprivileged user namespaces (virtiofsd sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true && echo "USERNS OK" || echo "USERNS BLOCKED"

      - name: qemu with KVM actually initialises
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-system-x86 qemu-utils
          # shellcheck disable=SC2054,SC2100  # commas/dashes are qemu option syntax
          case "$(uname -m)" in
            aarch64) qemu=qemu-system-aarch64; args=(-machine virt,accel=kvm,gic-version=max -cpu host -bios edk2-aarch64-code.fd) ;;
            x86_64)  qemu=qemu-system-x86_64;  args=(-machine q35,accel=kvm -cpu host) ;;
          esac
          if timeout 20 "$qemu" "${args[@]}" -display none -serial none -monitor none -S -pidfile /tmp/probe.pid -daemonize; then
            echo "KVM INIT OK"
            kill "$(cat /tmp/probe.pid)"
          else
            echo "KVM INIT FAILED"
            exit 1
          fi

name: lsm e2e (nested VM)

# Dev-loop workflow. Run the lsm e2e under a kernel with bpf in the
# active LSM list.
#
# Hosted runners boot without bpf-LSM (/sys/kernel/security/lsm lacks
# bpf) and cannot be rebooted mid-job, so the lsm tests otherwise skip.
# We nest a VM instead: reuse the runner's own kernel (already
# CONFIG_BPF_LSM=y) and boot it with "lsm=...,bpf" appended, sharing
# the runner rootfs so the checked-out tree, the toolchain, and the
# built artefacts are all present in the guest. Then run only the lsm
# tests inside. No nix: the same apt + make path an ordinary developer
# uses; the nested VM is the only delta.
#
# The BPF build deps mirror build.yml's "Install dependencies" step --
# clang llvm libbpf-dev gcc-multilib libelf-dev -- so clang finds the
# asm/ UAPI headers without hardcoding an include path. The e2e runtime
# deps (dwarves, kmod, linux-headers) match the ordinary e2e jobs.
#
# Push to this branch (no PR) to run; nothing else triggers on it.

on:
  push:
    branches: [lsm-e2e-vm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lsm-e2e-vm:
    name: lsm e2e (nested VM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install toolchain + BPF build deps + nested-VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dwarves kmod "linux-headers-$(uname -r)" \
            clang llvm libbpf-dev gcc-multilib libelf-dev \
            linux-tools-generic \
            qemu-system-x86 busybox-static virtiofsd
          pipx install virtme-ng          # the one new tool; swap for hand-rolled qemu if unwanted
          # bpftool: symlink the linux-tools-generic binary directly (the
          # /usr/sbin wrapper dispatches on uname -r and Canonical's azure
          # tools package is often empty). Mirrors go-test.yaml. On the
          # shared rootfs, so the guest sees it too.
          bpf_bin=$(ls /usr/lib/linux-tools/*-generic/bpftool | head -n 1)
          sudo ln -sf "$bpf_bin" /usr/local/bin/bpftool
          bpftool version

      - name: Build on the host (surfaces build errors outside the VM)
        run: |
          make bpfman-compile
          make build-e2e-grpc build-e2e-scripts
          # Build the e2e kmod on the host (same kernel version as the
          # guest); the guest only insmods it. TestParallel_GRPC gates on
          # this module being present.
          make e2e-kmod-build

      - name: Sanity -- the bare runner has no bpf-LSM (so tests would skip here)
        run: |
          echo -n "host lsm: "; cat /sys/kernel/security/lsm; echo
          if grep -qw bpf /sys/kernel/security/lsm; then
            echo "unexpected: bare runner already has bpf-LSM"
          else
            echo "expected: no bpf on the bare runner -- that is what the VM fixes"
          fi

      - name: Run the lsm e2e inside a VM booted with bpf-LSM
        run: |
          set -euxo pipefail
          # virtme-ng: reuse the runner kernel, append bpf to the LSM order,
          # share the rootfs (artefacts already built above), run as root,
          # propagate the exit code out. Guest is root, so the Makefile's
          # internal sudo is a no-op. /run is a fresh tmpfs in the guest, so
          # no stale-DB collisions.
          #
          # vng runs under sudo: it must read /boot/vmlinuz (root-only) and
          # /dev/kvm. Preserve PATH so sudo finds the pipx-installed vng.
          # virtiofsd (installed above) lets virtme share the rootfs over
          # virtiofs rather than 9p, which is far faster and avoids 9p fid
          # exhaustion. timeout bounds a hang to a clean failure.
          sudo timeout 900 env "PATH=$PATH" vng --run "/boot/vmlinuz-$(uname -r)" \
              --append "lsm=lockdown,capability,landlock,yama,apparmor,bpf" \
              --user root --cpus 2 --memory 4G --verbose \
              -- bash -euxo pipefail -c '
                cd "'"$PWD"'"
                # Guest runs as root, but virtme leaves /root read-only
                # (it overlays /home, /usr, /tmp, ... not /root). Point HOME
                # at the runner home, which is overlaid (writable) and holds
                # the warm go build/module caches from the host build.
                export HOME="'"$HOME"'"
                ulimit -n 1048576 2>/dev/null || ulimit -n "$(ulimit -Hn)"
                echo -n "guest lsm: "; cat /sys/kernel/security/lsm; echo
                grep -qw bpf /sys/kernel/security/lsm
                # Load the host-built kmod into the guest kernel (build is
                # already satisfied, so this only insmods). TestParallel_GRPC
                # skips unless it is present.
                make e2e-kmod-insmod
                # Run the host-built binaries; do NOT rebuild in the guest.
                # virtme shares the rootfs over 9p (virtiofsd absent), and a
                # go build over 9p exhausts fids ("too many open files"). The
                # run-e2e-* targets have no build prerequisites -- they just
                # exec the pre-built test binaries built on the host above.
                make run-e2e-grpc    TEST="TestParallel_GRPC/lsm"          STRESS_COUNT=1
                make run-e2e-scripts TEST="TestBPFManScripts/scripts/TestLsm_" STRESS_COUNT=1
              '
